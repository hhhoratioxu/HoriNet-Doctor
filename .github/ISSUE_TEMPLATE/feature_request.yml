name: Feature request / 功能建议
description: Suggest an improvement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and use case / 需求场景
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and privacy impact / 建议行为与隐私影响
    validations:
      required: true
