name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate-and-build:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: release-artifacts
      - name: Verify tag matches the manifest and require a beta
        shell: bash
        run: |
          python - <<'PY'
          import os, tomllib
          version=tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v'+version
          assert '-beta.' in version, 'This initial workflow only publishes beta prereleases'
          PY
      - name: Verify downloaded hashes
        working-directory: release-artifacts
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish unsigned beta prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-artifacts/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --verify-tag --prerelease --title "HoriNet Doctor $GITHUB_REF_NAME" --notes-file docs/RELEASE.md
